[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard"
version = "0.1.0"
description = "Structured Cognitive Trace Monitoring as a Control Protocol"
readme = "README.md"
requires-python = ">=3.12"  # control-arena requires >=3.12 (was >=3.10, which couldn't resolve)
dependencies = [
    "poseidon-compute",
    # Pinned: control-arena 14.2.0's text_editor tool calls execute(insert_text=...), which a newer
    # inspect-ai renamed to insert_line — so >=0.3.200 breaks every sample ("unexpected keyword argument
    # 'insert_text'"). 0.3.159 (control-arena's own floor) is validated to complete samples. Bump both
    # together only after re-running scripts/run_eval.py confirms the text_editor path still works.
    "inspect-ai==0.3.159",
    "control-arena>=14.2.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
    "openai>=2,<3",  # inspect-ai 0.3.159 needs openai 2.x; openai 3.x breaks its timeout handling ("unsupported operand +: float and Timeout"). Pin <3 so even `uv pip install` (which ignores uv.lock) can't resolve the broken 3.x.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv.sources]
poseidon-compute = { path = "../util", editable = true }
